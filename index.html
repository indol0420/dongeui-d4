        <div class="dv-sec">바로 가기</div><div class="dv-grid">${presets.map((p, i) => `<button type="button" class="btn${p.group ? ' ' + p.group : ''}" data-p="${i}">${esc(p.label)}</button>`).join('')}</div>
        <div class="dv-sec">설정</div><div class="dv-togs">${toggles.map(t => `<label class="dv-tog"><input type="checkbox" id="dv_${t.id}" ${devOn(t.id) ? 'checked' : ''}> ${esc(t.label)}</label>`).join('')}</div>
        <div class="dv-sec">기록</div><button type="button" class="btn" id="dvReset">저장·엔딩 기록 지우기</button> <span class="dv-msg" id="dvMsg"></span>
        <div class="dv-note">Ctrl+Shift+D로 열기 · ESC로 닫기 · 바로 가기를 누르면 지금 저장이 그 장면으로 덮어써져요.</div></div>`;
      b.querySelectorAll('[data-p]').forEach(btn => btn.addEventListener('click', () => { const p = presets[+btn.dataset.p]; close(); setTimeout(() => devJump(p), 0); }));
      toggles.forEach(t => { const el = b.querySelector('#dv_' + t.id); el.addEventListener('change', () => { dev.flags[t.id] = el.checked; meta.devFlags = dev.flags; saveMeta(); applyDevClasses(); if (S && screenName === 'play') updateHud(); }); });
      b.querySelector('#dvReset').addEventListener('click', () => { store.del(CH.saveKey); meta.endings = []; saveMeta(); b.querySelector('#dvMsg').textContent = '지웠어요'; });
    }, { cls: 'bare' });
    if (screenName === 'play') run(show); else show().then(() => { if (screenName === 'title') showTitle(); else if (screenName === 'hub') showHub(); });
  }
  function openMenu() {
    if (busy || modalOpen || screenName !== 'play') return;
    run(async () => {
      const r = await modal((b, close) => {
        b.innerHTML = `<div class="settings"><h4>일시 정지</h4>
          <div class="row"><div>조작<small>마우스: 비추고 클릭해서 조사 · F: 손전등 · 1~9: 소지품 · H: 수첩(단서 정리·힌트) · M: 안내도 · SPACE: 대사 넘기기</small></div></div>
          <div class="row"><div>저장<small>스테이지 시작과 위험한 순간 직전에 자동 저장돼요</small></div></div>
          <div class="modal-actions"><button type="button" class="btn" id="mTitle">타이틀로</button><button type="button" class="btn" id="mSet">설정</button><button type="button" class="btn primary" id="mBack" autofocus>계속하기</button></div></div>`;
        $('#mBack', b).addEventListener('click', () => close('back'));
        $('#mSet', b).addEventListener('click', () => close('set'));
        $('#mTitle', b).addEventListener('click', () => close('title'));
      }, { cls: 'bare', closeValue: 'back' });
      if (r === 'set') { setBusy(false); setTimeout(openSettings, 0); }
      if (r === 'title') { setTimeout(showTitle, 0); }
    });
  }
  /* 수첩: 지금까지 본 단서 목록 + 이종화의 생각(2단계) + 확인을 거쳐야 보이는 정답 */
  function pulseHint(on) { const b = $('#btnHint'); if (b) b.classList.toggle('pulse', !!on); }
  function openNotebook() {
    if (busy || modalOpen || screenName !== 'play') return;
    const key = CH.hintKey ? CH.hintKey(api) : null;
    const H = key && CH.hints[key];
    pulseHint(false);
    if (key) idle.nudged[key] = true;
    idle.ms = 0;
    run(async () => {
      S.hints = S.hints || {}; S.answers = S.answers || {};
      if (H && !S.hints[key]) { S.hints[key] = 1; S.hintCount = (S.hintCount || 0) + 1; }
      Sound.play('pages');
      await modal(b => {
        let asking = false;
        const draw = () => {
          const clues = CH.clues ? CH.clues(api) : [];
          const think = H ? H.think.map(t => (typeof t === 'function' ? t(api) : t)).filter(Boolean) : [];
          const lv = H ? Math.min(S.hints[key] || 0, think.length) : 0;
          const shown = H && S.answers[key];
          const ans = H ? (typeof H.answer === 'function' ? H.answer(api) : H.answer) : '';
          let acts = '';
          if (H && lv < think.length) acts = '<button type="button" class="btn" id="nMore">더 생각해 보기</button>';
          else if (H && !shown) acts = asking
            ? '<span class="nb-confirm">직접 풀어야 더 무섭다. 그래도 볼까?</span><button type="button" class="btn" id="nYes">정답 보기</button><button type="button" class="btn" id="nNo">그만둔다</button>'
            : '<button type="button" class="btn dim" id="nAns">정답 보기</button>';
          b.innerHTML = `<div class="notebook">
            <div class="nb-head"><span>이종화의 수첩</span><span>${esc(CH.notebookDate || '')}</span></div>
            <div class="nb-sec">알아낸 것</div>
            ${clues.length ? `<ul class="nb-clues">${clues.map(c => `<li>${esc(c)}</li>`).join('')}</ul>` : '<p class="nb-empty">아직 적은 게 없다. 손전등을 켜고 주변을 살펴보자.</p>'}
            <div class="nb-sec">생각</div>
            ${H ? think.slice(0, lv).map(t => `<p class="nb-think">${esc(t)}</p>`).join('') : '<p class="nb-think">지금은 딱히 떠오르는 게 없다.</p>'}
            ${shown ? `<p class="nb-answer">${esc(ans)}</p>` : ''}
            ${acts ? `<div class="nb-acts">${acts}</div>` : ''}
          </div>`;
          const on = (id, fn) => { const el = $('#' + id, b); if (el) el.addEventListener('click', fn); };
          on('nMore', () => { S.hints[key] = lv + 1; S.hintCount = (S.hintCount || 0) + 1; Sound.play('pages'); draw(); });
          on('nAns', () => { asking = true; Sound.play('click'); draw(); });
          on('nNo', () => { asking = false; Sound.play('click'); draw(); });
          on('nYes', () => { S.answers[key] = true; S.answerCount = (S.answerCount || 0) + 1; Sound.play('pages'); draw(); });
        };
        draw();
      }, { cls: 'bare' });
    });
  }

  /* ---------------- 프레임 루프 ---------------- */
  function tick(t) {
    const dt = Math.min(250, t - (lastT || t)); lastT = t;
    if (screenName === 'play' && S) {
      S.playMs = (S.playMs || 0) + dt;
      if (devOn('infBattery')) S.battery = 100;
      // 같은 목표에서 오래 멈춰 있으면 수첩 버튼을 깜빡여 알려 준다 (목표마다 한 번)
      if (!busy && !modalOpen && CH.hintKey) {
        idle.check += dt;
        if (idle.check > 1000) {
          idle.check = 0;
          const k = CH.hintKey(api);
          if (k !== idle.key) { idle.key = k; idle.ms = 0; }
        }
        idle.ms += dt;
        if (idle.key && idle.ms > IDLE_MS && !idle.nudged[idle.key]) {
          idle.nudged[idle.key] = true;
          pulseHint(true);
          caption('막혔다면 H · 수첩을 펼쳐 알아낸 것을 정리해 보자', { dur: 5200 });
        }
      }
      if (S.light && !busy && !modalOpen && !cutActive && S.battery > 0) {
        const before = S.battery;
        S.battery = Math.max(0, S.battery - dt / (CH.drainMs || 12000));
        if (Math.ceil(before) !== Math.ceil(S.battery)) updateHud();
        batteryWatch(before, S.battery);
      }
      let scale = 1;
      if (S.light && !reduce() && (S.battery < 10 || flickerUntil > t)) {
        if (t > nextFlick) { nextFlick = t + 380 + Math.random() * 520; flickVal = Math.random() < .4 ? .5 + Math.random() * .25 : 1; }
        scale = flickVal;
      }
      if (CH.onTick && !busy && !modalOpen) CH.onTick(api, dt);
      const ls = CH.lightScale ? CH.lightScale(api) : 1;
      const lr = stageW * (0.085 + 0.08 * clamp(S.battery, 0, 100) / 100) * scale * ls;
      if (Math.abs(lr - lastLr) > .5) { stage.style.setProperty('--lr', lr.toFixed(1) + 'px'); lastLr = lr; }
    }
    requestAnimationFrame(tick);
  }

  /* ---------------- 시작 ---------------- */
  function bind() {
    stage = $('#stage'); sceneEl = $('#scene'); spotsEl = $('#spots'); glowEl = $('#glow'); navsEl = $('#navs');
    hudEl = $('#hud'); capsEl = $('#captions'); narrEl = $('#narr'); narrWho = $('.who', narrEl); narrText = $('.text', narrEl);
    choiceEl = $('#choice'); modalEl = $('#modal'); screenEl = $('#screen'); tipEl = $('#tip'); jumpEl = $('#jump');
    invEl = $('#inv'); fxEl = $('#fx'); mapEl = $('#minimap'); toastEl = $('#toast');

    const measure = () => { const r = stage.getBoundingClientRect(); stageW = r.width || stageW; lastLr = 0; };
    measure();
    if (window.ResizeObserver) new ResizeObserver(measure).observe(stage); else window.addEventListener('resize', measure);
    stage.style.setProperty('--lx', '50%'); stage.style.setProperty('--ly', '50%');

    stage.addEventListener('pointermove', e => {
      const r = stage.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
      stage.style.setProperty('--lx', mouse.x.toFixed(1) + 'px'); stage.style.setProperty('--ly', mouse.y.toFixed(1) + 'px');
      if (!tipEl.hidden) positionTip();
    });
    stage.addEventListener('click', e => {
      if (narrNext && !e.target.closest('#choice,#modal,#screen,.hbtn,#minimap,#inv')) {
        if (performance.now() - narrOpenAt > 160) narrNext();
        return;
      }
      if (screenName === 'play' && selected && !busy && !e.target.closest('.spot,.nav,#inv,.hbtn,#minimap,#modal')) { selected = null; renderInv(); updateTip(); }
    });
    stage.addEventListener('contextmenu', e => { if (screenName === 'play') { e.preventDefault(); if (selected) { selected = null; renderInv(); updateTip(); } } });

    $('#btnLight').addEventListener('click', e => { e.stopPropagation(); if (!modalOpen) setLight(!S.light); });
    $('#btnHint').addEventListener('click', e => { e.stopPropagation(); openNotebook(); });
    $('#btnMenu').addEventListener('click', e => { e.stopPropagation(); openMenu(); });
    mapEl.addEventListener('click', e => { e.stopPropagation(); openMap(); });
    mapEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMap(); } });

    document.addEventListener('keydown', e => {
      if (!jumpEl.hidden) return;
      const k = e.key, c = e.code;
      if (e.ctrlKey && e.shiftKey && c === 'KeyD') { e.preventDefault(); openDev(); return; }
      if (modalOpen) {
        if (k === 'Escape') { e.preventDefault(); if (modalClose) modalClose(); return; }
        if (modalKey) modalKey(e);
        return;
      }
      if (choiceKey) { if (/^[1-9]$/.test(k)) { e.preventDefault(); choiceKey(+k); } return; }
      if (narrNext) {
        if (k === ' ' || k === 'Enter') { e.preventDefault(); if (performance.now() - narrOpenAt > 160) narrNext(); }
        else if (c === 'KeyF' && screenName === 'play') setLight(!S.light);
        return;
      }
      if (cardNext && (k === ' ' || k === 'Enter')) { e.preventDefault(); cardNext(); return; }
      if (screenName !== 'play' || !S) return;
      if (c === 'KeyF') { e.preventDefault(); setLight(!S.light); return; }
      if (busy) return;
      if (c === 'KeyH') { openNotebook(); return; }
      if (c === 'KeyM') { openMap(); return; }
      if (k === 'Escape') { if (selected) { selected = null; renderInv(); updateTip(); } else openMenu(); return; }
      if (/^[1-9]$/.test(k)) { const id = S.inv[+k - 1]; if (id) selectItem(id); }
    });
    requestAnimationFrame(tick);
  }

  const api = {
    get S() { return S; },
    get flags() { return S.flags; },
    flag(k, v) { if (v === undefined) return S.flags[k]; S.flags[k] = v; return v; },
    has: id => !!S && S.inv.includes(id),
    give, take, say, choice, sfx, onoma, caption, fx, danger, ghost, go, cut, uncut, render, toast, modal, doc, keypad,
    wait: sleep, esc,
    battery: addBattery,
    setLight,
    get light() { return !!(S && S.light); },
    get reduce() { return reduce(); },
    gameOver, checkpoint, stageClear, ending, blackout,
    showHud(on) { hudEl.hidden = !on; },
    sound: name => Sound.play(name),
    onKey(fn) { modalKey = fn; },
    pulseHint,
    run: fn => run(fn),
    dev: id => devOn(id),
    get busy() { return busy; }
  };

  // 시리즈 시작: 메인 화면(건물 고르기)부터. 첫 번째로 열린 장을 기본 장으로 둔다.
  function boot(hub, hot) {
    HUB = hub;
    const first = hub.buildings.find(b => b.data);
    start(first.data, hot, true);
  }
  function start(chapter, hot, viaHub) {
    CH = chapter;
    meta = Object.assign({ endings: [], sound: true, reduce: false, speed: 'normal' }, store.get(META_KEY) || {});
    if (!Array.isArray(meta.endings)) meta.endings = [];
    bind();
    stage.classList.toggle('reduce', !!meta.reduce);
    dev.flags = Object.assign({}, meta.devFlags || {}); applyDevClasses();
    Sound.setEnabled(meta.sound);
    if (hot && hot.S && hot.CP && hot.screenName === 'play') { S = hot.S; CP = hot.CP; enterPlay(); }
    else if (viaHub && HUB) showHub();
    else showTitle();
  }
  return { start, boot, api, snapshot: () => ({ S, CP, screenName }), _debug: { get S() { return S; }, run, restore, render, idle } };
})();

</script>
<script>
'use strict';
/* =================================================================
   제1장 · 중앙도서관 — 연체(延滯)
   장면 그림, 조사 지점, 퍼즐, 이벤트, 엔딩이 모두 여기 있다.
   퍼즐 정답: 6층 도어락 78154 · 4층 서랍 1211 · 이종화 대출 비밀번호 1215 · 배정은 대출 비밀번호 1211
   ================================================================= */
const CHAPTER1 = (() => {
  /* ---------------- 그림 도우미 ---------------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const n1 = v => (Math.round(v * 10) / 10);
  const R = (x, y, w, h, f, ex) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" fill="${f}"${ex ? ' ' + ex : ''}/>`;
  const P = (pts, f, ex) => `<polygon points="${pts}" fill="${f}"${ex ? ' ' + ex : ''}/>`;
  const Ln = (x1, y1, x2, y2, s, w, ex) => `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${s}" stroke-width="${w || 2}"${ex ? ' ' + ex : ''}/>`;
  const Pa = (d, f, ex) => `<path d="${d}" fill="${f}"${ex ? ' ' + ex : ''}/>`;
  const Ci = (cx, cy, r, f, ex) => `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(r)}" fill="${f}"${ex ? ' ' + ex : ''}/>`;
  const El = (cx, cy, rx, ry, f, ex) => `<ellipse cx="${n1(cx)}" cy="${n1(cy)}" rx="${n1(rx)}" ry="${n1(ry)}" fill="${f}"${ex ? ' ' + ex : ''}/>`;
  const T = (x, y, str, o = {}) => `<text x="${n1(x)}" y="${n1(y)}" font-size="${n1(o.size || 22)}" fill="${o.fill || '#d6cfba'}" text-anchor="${o.anchor || 'middle'}" style="font-family:${o.font || 'var(--font-mono)'};${o.ls ? 'letter-spacing:' + o.ls + 'px;' : ''}"${o.ex ? ' ' + o.ex : ''}>${esc(str)}</text>`;
  const rng = seed => { let s = (seed >>> 0) || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); };
  const SPINES = ['#5d302c', '#2f4b3f', '#2d3c56', '#5b4832', '#4b4f56', '#6c5b2d', '#3e3046', '#25292e', '#6b3c2b', '#405764', '#76664a', '#34403a'];
  const GDEFS = '<defs><filter id="gb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter><filter id="gb2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="42"/></filter></defs>';
  const SANS = 'var(--font-mono)', SERIF = 'var(--font-body)', DISP = 'var(--font-display)', HAND = 'var(--font-hand)';

  function books(x, y, w, h, seed, o = {}) {
    const r = rng(seed); let s = ''; let cx = x + 3;
    const pal = o.pal || SPINES;
    while (cx < x + w - 10) {
      let bw = 11 + Math.floor(r() * 17);
      if (cx + bw > x + w - 3) bw = x + w - 3 - cx;
      if (bw < 8) break;
      if (o.gap && cx + bw > o.gap[0] && cx < o.gap[0] + o.gap[1]) { cx = o.gap[0] + o.gap[1] + 1; continue; }
      const bh = Math.round(h * (0.66 + r() * 0.32));
      const col = pal[Math.floor(r() * pal.length)];
      const top = y + h - bh;
      s += R(cx, top, bw, bh, col);
      if (r() < 0.6) s += R(cx + 2, top + Math.round(bh * 0.1), bw - 4, Math.max(2, Math.round(bh * 0.05)), '#c9b98a', 'opacity=".45"');
      if (r() < 0.55) s += R(cx + 1.5, y + h - Math.round(bh * 0.22), bw - 3, Math.max(4, Math.round(bh * 0.11)), '#d9d2bf', 'opacity=".5"');
      cx += bw + (r() < 0.08 ? 4 : 1);
    }
    return s;
  }
  function bookcase(x, y, w, h, rows, seed, o = {}) {
    let s = R(x - 12, y - 12, w + 24, h + 24, o.frame || '#33291f') + R(x, y, w, h, '#14171a');
    const rh = h / rows;
    for (let i = 0; i < rows; i++) {
      const ry = y + i * rh;
      s += books(x, ry + 8, w, rh - 20, seed + i * 37, { gap: o.gaps && o.gaps[i] });
      s += R(x - 12, ry + rh - 12, w + 24, 12, o.board || '#4c3f31');
    }
    return s;
  }
  function room(fy, wall, floor) {
    let s = R(0, 0, 1600, fy, wall || '#262b31') + R(0, fy, 1600, 900 - fy, floor || '#16191c') + R(0, fy - 12, 1600, 12, '#1a1d21');
    for (let i = -10; i <= 10; i++) s += Ln(800 + i * 80, fy, 800 + i * 330, 900, '#1f2327', 2);
    for (let k = 1; k <= 4; k++) { const yy = Math.round(fy + (900 - fy) * (k * k) / 16); s += Ln(0, yy, 1600, yy, '#1f2327', 2); }
    return s;
  }
  function runner(x, y, k) {
    return `<g stroke="#effff6" stroke-width="${n1(k * 0.1)}" stroke-linecap="round" stroke-linejoin="round" fill="none">` +
      Ci(x + k * 0.62, y + k * 0.14, k * 0.1, '#effff6') +
      `<polyline points="${n1(x + k * 0.56)},${n1(y + k * 0.3)} ${n1(x + k * 0.44)},${n1(y + k * 0.58)}"/>` +
      `<polyline points="${n1(x + k * 0.28)},${n1(y + k * 0.4)} ${n1(x + k * 0.48)},${n1(y + k * 0.32)} ${n1(x + k * 0.7)},${n1(y + k * 0.46)}"/>` +
      `<polyline points="${n1(x + k * 0.44)},${n1(y + k * 0.58)} ${n1(x + k * 0.26)},${n1(y + k * 0.76)} ${n1(x + k * 0.14)},${n1(y + k * 0.74)}"/>` +
      `<polyline points="${n1(x + k * 0.44)},${n1(y + k * 0.58)} ${n1(x + k * 0.62)},${n1(y + k * 0.72)} ${n1(x + k * 0.6)},${n1(y + k * 0.94)}"/></g>`;
  }
  function exitSign(x, y, w) {
    w = w || 150; const h = Math.round(w * 0.38);
    return R(x - 30, y - 30, w + 60, h + 60, '#2fd27a', 'opacity=".2" filter="url(#gb)"') +
      R(x, y, w, h, '#16955a', 'rx="4"') + R(x + 3, y + 3, w - 6, h - 6, 'none', 'stroke="#7fe3b0" stroke-width="1.5" rx="3"') +
      runner(x + h * 0.12, y + h * 0.1, h * 0.8) +
      T(x + w * 0.64, y + h * 0.66, '비상구', { size: Math.round(h * 0.38), fill: '#effff6', ls: 2 });
  }
  const greenSpill = (x, y, w, h, op) => R(x, y, w, h, '#2fd27a', `opacity="${op || 0.08}" filter="url(#gb2)"`);
  function plate(x, y, w, h, t, size) {
    return R(x, y, w, h, '#cbc3ae', 'rx="6"') + T(x + w / 2, y + h / 2 + size * 0.36, t, { size, fill: '#2b2721', font: DISP });
  }
  function openBookFlat(x, y, k, rot) {
    return `<g transform="rotate(${rot} ${n1(x)} ${n1(y)})">` +
      P(`${n1(x - 60 * k)},${n1(y - 8 * k)} ${n1(x)},${n1(y)} ${n1(x)},${n1(y + 30 * k)} ${n1(x - 62 * k)},${n1(y + 22 * k)}`, '#cfc7b2') +
      P(`${n1(x)},${n1(y)} ${n1(x + 60 * k)},${n1(y - 8 * k)} ${n1(x + 62 * k)},${n1(y + 22 * k)} ${n1(x)},${n1(y + 30 * k)}`, '#d8d0bc') +
      T(x - 30 * k, y + 18 * k, '44', { size: 12 * k, fill: '#6b6456' }) + T(x + 30 * k, y + 18 * k, '45', { size: 12 * k, fill: '#6b6456' }) + `</g>`;
  }
  function floorBooks(seed, y0, n) {
    const r = rng(seed); let s = '';
    for (let i = 0; i < (n || 6); i++) s += openBookFlat(120 + r() * 1360, y0 + r() * (880 - y0), 0.9 + r() * 0.6, -25 + r() * 50);
    return s;
  }
  function hand(cx, cy, deg, len, w) { const a = deg * Math.PI / 180; return Ln(cx, cy, cx + len * Math.sin(a), cy - len * Math.cos(a), '#2b2721', w, 'stroke-linecap="round"'); }
  function silhouette(x, y, k, op) {
    // 야간 사서: 검은 정장, 얼굴 자리에 빈 대출카드

  function planRun(f) {

    while (picks.length < n) { const a = pool[Math.floor(Math.random() * pool.length)]; if (!picks.includes(a)) picks.push(a); }
